  <script>
  document.addEventListener("DOMContentLoaded", () => {
    const scramble = document.querySelectorAll(".loading-letter");
    const preloader = document.querySelectorAll(".preloader-wrapper");
    gsap.registerPlugin(ScrambleTextPlugin);
    gsap.set(scramble, {
      opacity: 0,
      filter: "blur(5px)",
      visibility: "visible"
    });
    gsap.set(preloader, {
      opacity: 1,
      display: "block"
    });
    const allText = [...scramble].map(el => el.textContent).join("");
    const uniqueChars = [...new Set(allText)].join("");
    const tl = gsap.timeline();
    tl.to(scramble, {
      duration: 2,
      delay: 0.2,
      opacity: 1,
      filter: "blur(0px)",
      scrambleText: {
        text: "{original}",
        chars: uniqueChars,
        speed: 0.5
      },
      stagger: 0.2,
      ease: "power2.out"
    })
    .to(scramble, {
      opacity: 0,
      duration: 0.5,
      ease: "power1.inOut"
    }, "+=0.2")
    .to(preloader, {
      opacity: 0,
      duration: 0.4,
      display: "none",
      ease: "power1.inOut"
    }, "scramble+=0.3");
  });
</script>
  <script>
  document.querySelectorAll('.collection-item-2').forEach(item => {
    const nameEl = item.querySelector('.project-name');
    if (!nameEl) return;
    const originalText = nameEl.textContent;
    const cleanLetters = originalText.replace(/[^a-zA-Z]/g, '').split('');
    const totalLength = originalText.length;
    item.addEventListener('mouseenter', () => {
      let step = 0;
      const interval = setInterval(() => {
        let result = '';
        for (let i = 0; i < totalLength; i++) {
          const currentChar = originalText[i];
          if (i < step || !/[a-zA-Z]/.test(currentChar)) {
            result += currentChar;
          } else {
            const randomIndex = Math.floor(Math.random() * cleanLetters.length);
            result += cleanLetters[randomIndex];
          }
        }
        nameEl.textContent = result;
        step++;
        if (step > totalLength) {
          clearInterval(interval);
          nameEl.textContent = originalText;
        }
      }, 60);
    });
  });
</script>
