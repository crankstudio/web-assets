  <style>
.fit-title {
  white-space: nowrap;
  padding: 0;
  margin: 0;
  line-height: 1;
  text-align: left !important;
  pointer-events: none;
}
</style>
  <script>
function fitText() {
  const el = document.querySelector('.fit-title');
  if (!el) return;
  el.style.fontSize = '100px';
  el.style.width = 'max-content';
  // Force reflow
  el.getBoundingClientRect();
  const viewportWidth = window.innerWidth;
  const textWidth = el.getBoundingClientRect().width;
  const ratio = viewportWidth / textWidth;
  const newSize = 100 * ratio * 0.99;
  el.style.width = '';
  el.style.fontSize = newSize + 'px';
}
document.fonts.ready.then(function() {
  setTimeout(fitText, 100);
});
window.addEventListener('resize', fitText);
</script>
  <style>
.custom-cursor {
  position: fixed;
  left: 50%;
  top: 50%;
  pointer-events: none;
  z-index: 9999;
  font-size: 14px;
  font-family: inherit;
  font-weight: 500;
  letter-spacing: 0.05em;
  color: white;
  mix-blend-mode: difference;
  transform: translate(-50%, -50%);
  transition: opacity 0.2s ease;
  visibility: hidden;
  white-space: nowrap;
  overflow: hidden;
}
</style>
  <script>
const cursor = document.createElement('div');
cursor.classList.add('custom-cursor');
document.body.appendChild(cursor);
document.addEventListener('mousemove', function(e) {
  cursor.style.left = e.clientX + 'px';
  cursor.style.top = e.clientY + 'px';
  cursor.style.visibility = 'visible';
  const target = e.target;
  const isInteractive = target.closest('button') || 
                        target.closest('a:not(.w-slider-arrow-left):not(.w-slider-arrow-right)');
  if (isInteractive) {
    cursor.style.opacity = '0';
  } else {
    cursor.style.opacity = '1';
    cursor.textContent = e.clientX < window.innerWidth / 2 ? '← Prev' : 'Next →';
  }
});
document.addEventListener('mouseleave', function() {
  cursor.style.visibility = 'hidden';
});
</script>
